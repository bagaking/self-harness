name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  deterministic-checks:
    name: Deterministic checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize local layout
        run: scripts/init.sh

      - name: Check documents
        run: scripts/docs-check.sh

      - name: Check Codex preflight fixtures
        run: scripts/codex-local-preflight-fixture-check.sh
